name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:

# Never run two production deploys at once.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-production' || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace client

  # Optional push-to-deploy over SSH. Skipped unless the repository variable
  # DEPLOY_PATH is set, so forks and clones run CI only. See the README.
  deploy:
    name: Deploy over SSH
    needs: check
    if: github.event_name == 'push' && vars.DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            git pull --ff-only
            # The database is live: snapshot it before migrations run on boot.
            # A failure here aborts the deploy rather than touching real data.
            bash ./scripts/backup-db.sh
            docker compose up -d --build
            docker image prune -f
